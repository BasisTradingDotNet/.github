name: Update dev stats

on:
  schedule:
    - cron: "0 3 * * *"   # daily, after the previous UTC day completes
  workflow_dispatch:

concurrency:
  group: dev-stats
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r stats/requirements.txt

      - name: Clone all org repos
        env:
          # Fine-grained org PAT with contents:read + pull-requests:read
          # + metadata:read on all BasisTradingDotNet repos.
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: |
          mkdir -p /tmp/org-repos
          gh repo list BasisTradingDotNet --limit 200 --json name --jq '.[].name' |
          while read -r name; do
            git clone --quiet \
              "https://x-access-token:${GH_TOKEN}@github.com/BasisTradingDotNet/${name}.git" \
              "/tmp/org-repos/${name}"
          done

      - name: Collect stats
        env:
          GH_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: python stats/collect_stats.py --repos-dir /tmp/org-repos --out-dir data

      - name: Render charts
        run: python stats/render_charts.py --data-dir data --out-dir profile/assets/stats

      # main is PR-protected (0 approvals required). Push to a bot branch,
      # open/update a PR, and squash-merge it — never push to main directly.
      - name: Open PR and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/dev-stats"
          DATE="$(date -u +%F)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the just-rendered working tree; branch off current HEAD (main).
          git checkout -B "$BRANCH"

          git add data profile/assets/stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
            if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
              gh pr merge "$BRANCH" --squash --delete-branch || true
            fi
            exit 0
          fi

          git commit -m "chore: update dev stats (${DATE})"
          git push -u origin "$BRANCH" --force-with-lease

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "Updating existing PR for ${BRANCH}"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update dev stats (${DATE})" \
              --body "Automated daily refresh of org profile engineering stats (CSVs + SVGs)."
          fi

          gh pr merge "$BRANCH" --squash --delete-branch
